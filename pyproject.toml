[project]
name = "thunderbird-mcp"
version = "0.4.0"
description = "Thunderbird email MCP for search, attachments, drafts, sending and mailbox automation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "jamessi1989 and contributors"}]
keywords = ["thunderbird", "mcp", "email", "imap", "attachments", "semantic-search", "codex", "claude-code", "opencode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
]
dependencies = [
    "fastembed>=0.8.1",
    "keyring>=25.7.0",
    "mcp[cli]>=1.28.1,<2",
    "numpy>=2.2.6",
    "rapidfuzz>=3.14.5",
    "tomlkit>=0.13,<1",
    "pypdf>=6,<7",
    "defusedxml>=0.7.1,<1",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
ocr = ["Pillow>=11,<13"]

[project.urls]
Homepage = "https://github.com/jamessi1989/thunderbirdmcp"
Documentation = "https://github.com/jamessi1989/thunderbirdmcp#readme"
Repository = "https://github.com/jamessi1989/thunderbirdmcp"
Issues = "https://github.com/jamessi1989/thunderbirdmcp/issues"
Changelog = "https://github.com/jamessi1989/thunderbirdmcp/blob/main/CHANGELOG.md"

[project.scripts]
thunderbird-mcp = "thunderbird_mcp.server:main"
thunderbird-mcp-index = "thunderbird_mcp.index:cli"
thunderbird-mcp-embed = "thunderbird_mcp.search:cli"
thunderbird-mail-web = "thunderbird_mcp.web:main"
thunderbird-mail = "thunderbird_mcp.cli:main"
tbmail = "thunderbird_mcp.cli:main"
thunderbird-mcp-setup = "thunderbird_mcp.setup:main"
thunderbird-mcp-service = "thunderbird_mcp.service:main"
thunderbird-mcp-http = "thunderbird_mcp.remote:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thunderbird_mcp"]

[tool.hatch.build.targets.sdist]
only-include = [
    "thunderbird_mcp", "scripts", "tests", "systemd", "docs", ".github",
    "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "ROADMAP.md",
    "pyproject.toml", "uv.lock",
]
